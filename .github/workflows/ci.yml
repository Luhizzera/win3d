name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # windows-latest, not ubuntu: apps/common and apps/unified_viewer are Win32
    # + OpenGL (windows.h, wglCreateContext, opengl32), so a Linux runner cannot
    # build the whole project. Every engine/ library is portable C++ and would
    # build on Linux, but validating that would need a "skip apps" option that
    # does not exist yet -- noted as follow-up rather than half-done here.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Installing pybind11 means CI also builds the binding modules. That
      # used to buy compile coverage only; since the unstructured layer got
      # bindings (DIVIDA_TECNICA.md 5.2) there is a real Python suite
      # registered with ctest, so this step is now what makes that suite run
      # at all. Without it CMake silently skips bindings/python, the build
      # still passes, and a whole registered suite disappears -- which is the
      # failure --no-tests=error exists to catch, but only for the case where
      # *no* test registers.
      - name: Install pybind11
        run: python -m pip install --upgrade pip pybind11

      # Every run so far has failed at exactly this step (DIVIDA_TECNICA.md
      # 5.1), and GitHub now requires sign-in to read a run's own log even on
      # a public repo -- so a failure here used to be invisible to anyone
      # without a browser session. The tail of cmake's own output is echoed
      # as a single ::error:: workflow command instead, which becomes a
      # check-run annotation the public REST API returns with no
      # authentication (unlike the log itself), specifically so this failure
      # is diagnosable from outside a logged-in browser. Remove once
      # Configure has passed at least once.
      - name: Configure
        run: |
          $cmakeDir = python -m pybind11 --cmakedir
          Write-Output "::notice::cmake version: $((cmake --version)[0])"
          Write-Output "::notice::pybind11 cmakedir: $cmakeDir"
          Write-Output "::notice::generators: $(cmake --help 2>&1 | Select-String -Pattern '^\*|Visual Studio')"
          $output = cmake -S . -B build -Dpybind11_DIR="$cmakeDir" 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Output $_.ToString() }
          if ($exitCode -ne 0) {
            $tail = ($output | Select-Object -Last 40 | ForEach-Object { $_.ToString() }) -join "%0A"
            Write-Output "::error::Configure falhou (exit $exitCode). Ultimas linhas:%0A$tail"
            exit $exitCode
          }

      - name: Build
        run: cmake --build build --config Release

      # --no-tests=error is the point of this step, not a detail: without it,
      # a configuration that silently stops registering tests reports success
      # with zero tests run. This project already lost weeks of "passing" test
      # runs to exactly that class of bug once (every assert() was a no-op
      # under NDEBUG in Release builds), so a green CI that ran nothing is a
      # failure mode worth spending one flag to make impossible.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error

      # engine/gpu is skipped on CI (no CUDA Toolkit on the runner -- the root
      # CMakeLists' check_language(CUDA) guard handles that by design), so
      # aether_gpu_tests does not run here and still depends on a local run.
      # Printed rather than assumed, so the gap is visible in every log.
      - name: Report which suites ran
        if: always()
        run: ctest --test-dir build -C Release --show-only=json-v1 | python -c "import json,sys; d=json.load(sys.stdin); names=[t['name'] for t in d['tests']]; print(f'{len(names)} suites registradas:'); [print(' -', n) for n in names]"
